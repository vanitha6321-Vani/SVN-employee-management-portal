<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>SVN Admin Login</title><link rel="stylesheet" href="style.css"></head>
<body class="login-body">
<div class="login-container">
<h2>SVN ELECTRICAL WORKS</h2><h3>Admin Login</h3>
<input type="text" id="adminUser" placeholder="Username = admin">
<input type="password" id="adminPass" placeholder="Password = admin123">
<button onclick="adminLogin()">Login to Dashboard</button>
<p style="margin-top:15px;"><a href="employee.html" style="color:#2563eb;text-decoration:none;font-weight:bold;">👷 Employee Facial Attendance →</a></p>
<p id="loginError" style="color:red;margin-top:10px;"></p>
</div>
<script>
function adminLogin(){
  const u=document.getElementById('adminUser').value.trim();
  const p=document.getElementById('adminPass').value.trim();
  if(u==="admin" && p==="admin123"){ window.location.href="dashboard.html"; }
  else{ document.getElementById('loginError').innerText="Wrong! Use admin / admin123"; }
}
</script>
</body></html>
