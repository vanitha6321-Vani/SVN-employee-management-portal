<script>
const video = document.getElementById('video');
const statusText = document.getElementById('status');
const logText = document.getElementById('logText');

async function startCamera(){
  try{
    const stream = await navigator.mediaDevices.getUserMedia({video: true});
    video.srcObject = stream;
    statusText.innerText = "✅ Camera Ready - Face center lo pettu";
  } catch(e){
    statusText.innerText = "❌ Camera Allow cheyaledu - Allow ivvu";
  }
}
startCamera();

// Simple Face Check - No heavy model needed for GitHub Pages
document.getElementById('captureBtn').onclick = () => {
  // Video lo image unda leda check
  if(video.srcObject && video.readyState === 4){
    const now = new Date();
    const timeString = now.toLocaleString('en-IN', {timeZone: 'Asia/Kolkata'});
    statusText.innerText = "✅ Attendance Marked: " + timeString;
    logText.innerText = "Present Today: " + timeString;
    document.getElementById('attendanceLog').innerHTML = `<p style="color:green; font-weight:bold;">✅ Present - ${timeString}</p>`;
    localStorage.setItem('attendance_' + now.toDateString(), timeString);
    alert("Attendance Success Vanitha! ✅ Time: " + timeString);
  } else {
    statusText.innerText = "❌ Camera ready kaaledu, 2 sec aagi malli nokku";
    startCamera();
  }
};

// Old log chupinchu
const saved = localStorage.getItem('attendance_' + new Date().toDateString());
if(saved){ logText.innerText = "Present Today: " + saved; }
</script>
